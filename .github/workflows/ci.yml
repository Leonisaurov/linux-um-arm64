name: um-arm64 CI

# Build and boot the arm64 User Mode Linux port on a *native* aarch64 host.
#
# The port's own documentation assumed an x86_64 build domain with a
# qemu-system-aarch64 VM as the run domain, because no arm64 hardware was
# available. GitHub's `ubuntu-24.04-arm` hosted runner removes that deviation
# entirely: it is a real arm64 kernel, so `./linux` is an ordinary aarch64
# process and can be built and booted on the same machine, which is what the
# port set out to demonstrate. No qemu, no TCG, no ssh staging.
#
# The gate verdict is the marker string in the boot log, never the exit status,
# plus an independent BUG:/WARNING: scan (harness/native.sh).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# One build per ref. A cancelled run must not race a live one, and the ccache
# key churns for no reason when two runs overlap.
concurrency:
  group: um-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (native aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
              /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h / "$RUNNER_TEMP" || true

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
              clang lld llvm bc flex bison libelf-dev libssl-dev zstd ccache
          clang --version | head -1
          ld.lld --version | head -1
          nproc

      # ccache keyed by commit with a stable prefix. Restore/save are separate
      # on purpose: the save runs `if: always()`, so a build that fails late
      # still leaves its compiler cache behind and the next attempt is
      # incremental. The cache holds only the compiler cache, never build
      # outputs, so a stale restore cannot splice an old object into a new
      # binary -- ccache hashes inputs, it does not trust mtimes.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-um-arm64-${{ github.sha }}
          restore-keys: |
            ccache-um-arm64-

      - name: Build kernel + stub
        run: |
          set -euo pipefail
          export O="$RUNNER_TEMP/umarm-build"
          export ART="$RUNNER_TEMP/artifacts"
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          bash tools/um-arm64/harness/ci-build.sh

      - name: Build initramfs gate fixture
        run: |
          set -euo pipefail
          export ART="$RUNNER_TEMP/artifacts"
          bash tools/um-arm64/harness/mkinitramfs.sh "$ART/initramfs.cpiogz"

      - name: ccache stats
        if: always()
        run: CCACHE_DIR="$RUNNER_TEMP/ccache" ccache --show-stats || true

      # run_attempt makes the key unique, so a rerun cannot collide with the
      # cache this same run already saved.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-um-arm64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Uploaded as one directory, not a list of files. upload-artifact roots an
      # artifact at the least common ancestor of its paths, so a list spanning
      # $RUNNER_TEMP/artifacts/* and $RUNNER_TEMP/initramfs.cpiogz gets rooted at
      # $RUNNER_TEMP and downloads back as artifacts/artifacts/... . Everything
      # the boot job needs already lives under $ART, so upload exactly that.
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: um-arm64-kernel
          path: ${{ runner.temp }}/artifacts/
          retention-days: 14

  boot:
    name: boot gate (${{ matrix.name }}, native aarch64)
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default path: the phone/desktop configuration, PTRACE_SYSEMU where
          # the host has it and seccomp for userspace execution.
          - name: default
            extra: ""
          # The port's own switch for the seccomp fast path.
          - name: seccomp
            extra: "seccomp=on"
          # Force the pre-5.3 arm64 fallback: PTRACE_SYSCALL plus a syscall
          # cancellation through NT_ARM_SYSTEM_CALL. This is the path a 4.19
          # Android kernel takes, and it is testable everywhere by design.
          - name: nosysemu
            extra: "nosysemu"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download kernel artifacts
        uses: actions/download-artifact@v4
        with:
          name: um-arm64-kernel
          path: ${{ runner.temp }}/artifacts

      # UML is the ptrace tracer of its own stub children. yama ptrace_scope=1
      # (the Ubuntu default) already allows tracing descendants; 0 removes any
      # doubt. Failure here is not fatal to the run.
      - name: Relax ptrace scope
        run: |
          cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || echo "no yama"
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Boot gate
        run: |
          set -euo pipefail
          ls -la "$RUNNER_TEMP/artifacts"
          export BIN="$RUNNER_TEMP/artifacts/linux-um-arm64"
          export INITRD="$RUNNER_TEMP/artifacts/initramfs.cpiogz"
          export ART="$RUNNER_TEMP/run"
          export GATE="g2-${{ matrix.name }}"
          export MARKER="UMARM_GUEST_OK"
          export INIT=/init
          export TIMEOUT=180
          export MEM=512M
          export EXTRA_ARGS="${{ matrix.extra }}"
          bash tools/um-arm64/harness/native.sh

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: um-arm64-boot-${{ matrix.name }}
          path: ${{ runner.temp }}/run/g2-${{ matrix.name }}
          if-no-files-found: warn
          retention-days: 14

      - name: Step summary
        if: always()
        run: |
          {
            echo "### boot gate: ${{ matrix.name }}"
            echo '```'
            cat "$RUNNER_TEMP/run/g2-${{ matrix.name }}/result.txt" 2>/dev/null || echo "no result.txt"
            echo '```'
            if [ -s "$RUNNER_TEMP/run/g2-${{ matrix.name }}/kernel-bugs.txt" ]; then
              echo "#### kernel diagnostics"
              echo '```'
              cat "$RUNNER_TEMP/run/g2-${{ matrix.name }}/kernel-bugs.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
