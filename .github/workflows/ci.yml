name: um-arm64 CI

# Build and boot the arm64 User Mode Linux port on a *native* aarch64 host.
#
# The port's own documentation assumed an x86_64 build domain with a
# qemu-system-aarch64 VM as the run domain, because no arm64 hardware was
# available. GitHub's `ubuntu-24.04-arm` hosted runner removes that deviation
# entirely: it is a real arm64 kernel, so `./linux` is an ordinary aarch64
# process and can be built and booted on the same machine, which is what the
# port set out to demonstrate. No qemu, no TCG, no ssh staging.
#
# Every gate's verdict is a marker string in the boot log plus an independent
# BUG:/WARNING: scan (harness/native.sh), and several gates add a check on the
# *host* side of the boundary they test (LD_PRELOAD shim loaded, hostfs write
# visible, guest compiler output correct).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The flake loop is a campaign rather than a gate: 200 iterations is about
  # twenty minutes, and a loop that runs on every push is a loop people turn off.
  # Weekly, and on demand with a smaller n when the wiring itself is what is
  # being checked.
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:
    inputs:
      n:
        description: 'flake loop iterations'
        required: false
        default: '200'

permissions:
  contents: read

concurrency:
  group: um-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (native aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
              /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h / "$RUNNER_TEMP" || true

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
              clang lld llvm bc flex bison libelf-dev libssl-dev zstd ccache \
              e2fsprogs debootstrap
          clang --version | head -1
          ld.lld --version | head -1
          nproc

      # ccache keyed by commit with a stable prefix. Restore/save are separate
      # on purpose: the save runs `if: always()`, so a build that fails late
      # still leaves its compiler cache behind and the next attempt is
      # incremental. Only the compiler cache is cached, never build outputs, so
      # a stale restore cannot splice an old object into a new binary -- ccache
      # hashes inputs, it does not trust mtimes. Both kernels below share it.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-um-arm64-${{ github.sha }}
          restore-keys: |
            ccache-um-arm64-

      # Two kernels, in separate directories so a run cannot be misread: the
      # shipped arm64_defconfig, and the same tree with config/docker.config
      # merged, which the docker prerequisites gate needs.
      - name: Build kernel (default config)
        run: |
          set -euo pipefail
          export O="$RUNNER_TEMP/umarm-build"
          export ART="$RUNNER_TEMP/artifacts/default"
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          bash tools/um-arm64/harness/ci-build.sh

      - name: Build kernel (docker config)
        run: |
          set -euo pipefail
          export O="$RUNNER_TEMP/umarm-build-docker"
          export ART="$RUNNER_TEMP/artifacts/docker"
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          export EXTRA_CONFIG="tools/um-arm64/config/docker.config"
          bash tools/um-arm64/harness/ci-build.sh

      # The 4 KB build, which the port documents as the alternative for hosts
      # that know their page size and nothing in CI had ever booted. It is the
      # same tree with one Kconfig choice flipped, so it is a different kernel
      # and not a different configuration of the same one.
      - name: Build kernel (4 KB pages)
        run: |
          set -euo pipefail
          export O="$RUNNER_TEMP/umarm-build-4k"
          export ART="$RUNNER_TEMP/artifacts/4k"
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          export PAGE_SIZE=4k
          bash tools/um-arm64/harness/ci-build.sh

      # The negative control for the rss gate: the same kernel with the literal
      # PTRS_PER_PTE back, which is the defect that gate is about. It exists
      # because a clean log from the gate cannot be told apart from a workload
      # that never reached the mechanism, and the boot job requires this kernel
      # to reproduce the BUG. Applied and reverted here so every other build in
      # this job sees a pristine tree.
      - name: Build the control kernel (rss negative control)
        run: |
          set -euo pipefail
          git apply --check tools/um-arm64/config/control-ptrs-per-pte.patch
          git apply tools/um-arm64/config/control-ptrs-per-pte.patch
          trap 'git checkout -- arch/um/include/asm/pgtable-4level.h' EXIT
          export O="$RUNNER_TEMP/umarm-build-control"
          export ART="$RUNNER_TEMP/artifacts/control"
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          bash tools/um-arm64/harness/ci-build.sh

      # Loadable modules. The code is wired for this subarch and the config is
      # off, so what these gates answer is whether the loader actually works
      # when the host is a userspace process. `make modules` needs the kernel
      # built first, which is why this runs ci-build.sh twice.

      # The clock gate's negative control: timer_read() returns double, so the
      # guest's clock runs 2x fast and clock-control must go red. ART's basename
      # is what the boot matrix calls this kernel, so it cannot be "control".
      - name: Build the control kernel (clock negative control)
        run: |
          set -euo pipefail
          git apply --check tools/um-arm64/config/control-clock.patch
          git apply tools/um-arm64/config/control-clock.patch
          trap 'git checkout -- arch/um/kernel/time.c' EXIT
          export O="$RUNNER_TEMP/umarm-build-control-clock"
          export ART="$RUNNER_TEMP/artifacts/control-clock"
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          bash tools/um-arm64/harness/ci-build.sh
      - name: Build kernel (modules config)
        run: |
          set -euo pipefail
          export O="$RUNNER_TEMP/umarm-build-modules"
          export ART="$RUNNER_TEMP/artifacts/modules"
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          export EXTRA_CONFIG="tools/um-arm64/config/modules.config"
          bash tools/um-arm64/harness/ci-build.sh
          bash tools/um-arm64/harness/ci-build.sh modules
          # The .ko lands deep in the object tree. Collected here because the
          # gate loads it through a hostfs share, and a gate that silently finds
          # no module is worse than one that fails.
          mkdir -p "$ART/modules"
          find "$O" -name '*.ko' -exec cp -v {} "$ART/modules/" \;
          ls -la "$ART/modules"

      - name: Build Alpine root filesystem
        run: |
          set -euo pipefail
          export ART="$RUNNER_TEMP/artifacts"
          bash tools/um-arm64/harness/mkrootfs.sh "$ART/alpine.ext4"

      - name: Build initramfs gate fixture
        run: |
          set -euo pipefail
          export ART="$RUNNER_TEMP/artifacts"
          bash tools/um-arm64/harness/mkinitramfs.sh "$ART/initramfs.cpiogz"

      # The Alpine initramfs: the guest the app boots when it has no disk image,
      # and the fixture the Alpine-initramfs gate boots. It exists because a
      # static freestanding /init cannot tell a complete archive from an empty
      # one -- busybox is a dynamic musl binary, so if it runs, the loader and
      # libc and the symlinks that point at them all came along.
      - name: Build the Alpine initramfs
        run: |
          set -euo pipefail
          export ART="$RUNNER_TEMP/artifacts"
          DISTRO=alpine bash tools/um-arm64/harness/mkinitramfs.sh "$ART/initramfs-alpine.cpiogz"

      - name: ccache stats
        if: always()
        run: CCACHE_DIR="$RUNNER_TEMP/ccache" ccache --show-stats || true

      # run_attempt makes the key unique, so a rerun cannot collide with the
      # cache this same run already saved.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-um-arm64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Uploaded as one directory, not a list of files. upload-artifact roots an
      # artifact at the least common ancestor of its paths, so a list spanning
      # several directories gets rooted above them and downloads back nested.
      # Everything the boot job needs is under $RUNNER_TEMP/artifacts.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: um-arm64-kernels
          path: ${{ runner.temp }}/artifacts/
          retention-days: 14

  # The gates below prove the port. This job proves the *artifact*: the launcher
  # a person actually uses, driven through the contract dist/umdebian/README.md
  # documents -- a command in, its output out, its status propagated, the host
  # share both ways, and a sentence instead of a stack trace when the image is
  # already in use. It needs its own Debian image because the guest writes to it.
  # The kernel gates cannot reach the networking helpers: the guest has no
  # network, and the bug this one exists for is not about packets anyway. It
  # needs no kernel, no passt and no root, so it runs in parallel with the rest.
  net-helpers:
    name: networking helpers (umnet)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify umnet
        run: bash tools/um-arm64/harness/ci-umnet.sh

      - name: Step summary
        if: always()
        run: |
          {
            echo "### networking helpers (umnet)"
            echo '```'
            cat umnet-ci/result.txt 2>/dev/null || echo "no result.txt"
            echo '```'
            cat umnet-ci/checks.txt 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

  # The artifact for the phone itself. Everything else here builds the glibc
  # variant, which is the run domain and what the gates boot -- but an Android
  # app process is started by zygote with a seccomp filter already installed, and
  # glibc's startup issues calls that filter kills (rseq, set_robust_list), so a
  # glibc binary dies before main() having printed nothing. bionic is the libc
  # that filter was written for, so this job builds the same kernel against the
  # NDK and publishes it with the stub and the launcher it needs.
  # The one job that does *not* run on an arm runner, and the reason is the NDK:
  # Google publishes it for x86_64 hosts only (there is no android-ndk-rXX-linux
  # for aarch64), so an arm64 runner cannot execute the compiler it just
  # unpacked -- "cannot execute binary file: Exec format error". Cross-compiling
  # is not a compromise here: the target is what matters, and the target is
  # aarch64-android either way. This is also how the port's bionic binaries were
  # built in the first place.
  android:
    name: android/bionic (cross to aarch64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Pinned by version and by the sha1 Google publishes for it, the way the
      # Alpine rootfs is pinned by sha256: a toolchain that changes under a job is
      # a job that cannot be reproduced. r27c is what the port's bionic binaries
      # were built with, so this is the same compiler the working ones came from.
      ANDROID_NDK_VERSION: '27.2.12479018'
      ANDROID_NDK_URL: https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
      ANDROID_NDK_SHA1: 090e8083a715fdb1a3e402d0763c388abb03fb4e
      ANDROID_API: '30'
      # passt is pinned by commit, not by tag or by "latest": the patch below
      # is a diff against exactly this tree, and it is the only way to know what
      # the bionic port was written against. The short form of this hash is what
      # the working binary reports as its version.
      PASST_COMMIT: defc25b9444c508d21badb6bc9a0b835ddd01126
      PASST_URL: https://passt.top/passt
      NDK_HOME: ${{ github.workspace }}/.ci/ndk
      # `github.workspace` and not `runner.temp`: the `runner` context does not
      # exist in a job-level `env:`, and using it does not fail this job -- it
      # fails the whole run in 0s with zero jobs, so nothing can report on it.
      # harness/check-workflow.sh exists because this was got wrong once here.
      NDK_ZIP: ${{ github.workspace }}/.ci/android-ndk-r27c-linux.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
              /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h / "$RUNNER_TEMP" || true

      - name: Install host toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
              clang lld llvm bc flex bison libelf-dev libssl-dev zstd ccache unzip
          clang --version | head -1
          ld.lld --version | head -1

      # The zip, not the unpacked tree: 663 MB instead of several GB, and the
      # sha1 is checked on every use, so a cache entry is never trusted further
      # than the download it came from. Keyed by version *and* digest, i.e.
      # content-addressed, so it cannot go stale. `runner.arch` is X64 here,
      # which is the point: this cache is only usable from an x86_64 host.
      - name: Restore the NDK archive
        id: ndk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NDK_ZIP }}
          key: ndk-${{ env.ANDROID_NDK_VERSION }}-${{ env.ANDROID_NDK_SHA1 }}-${{ runner.arch }}

      - name: Fetch and unpack the NDK
        run: |
          set -euo pipefail
          # The zip lives under the workspace so its cache path can be absolute
          # and context-free (see the job-level env), which means the directory
          # has to exist first: curl reports a missing one as
          # "curl: (23) Failure writing output to destination", naming neither
          # the path nor the reason.
          mkdir -p "$(dirname "$NDK_ZIP")"
          if [ ! -f "$NDK_ZIP" ]; then
            echo "downloading $ANDROID_NDK_URL"
            curl -fsSL --retry 3 --retry-all-errors -o "$NDK_ZIP.part" "$ANDROID_NDK_URL"
            mv "$NDK_ZIP.part" "$NDK_ZIP"
          fi
          echo "$ANDROID_NDK_SHA1  $NDK_ZIP" | sha1sum -c -
          rm -rf "$NDK_HOME"
          mkdir -p "$NDK_HOME"
          unzip -q "$NDK_ZIP" -d "$NDK_HOME"
          ls -d "$NDK_HOME"/android-ndk-* >/dev/null
          "$NDK_HOME"/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/clang \
             --version | head -1
          df -h "$NDK_HOME" || true

      # Only when it was a miss: saving a key that already exists is an error.
      - name: Save the NDK archive
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NDK_ZIP }}
          key: ndk-${{ env.ANDROID_NDK_VERSION }}-${{ env.ANDROID_NDK_SHA1 }}-${{ runner.arch }}

      # A separate cache chain from the glibc builds: same ccache, different
      # compiler and different target, so the objects never overlap.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache-bionic
          key: ccache-um-arm64-bionic-${{ github.sha }}
          restore-keys: |
            ccache-um-arm64-bionic-

      # Both page sizes. 16 KB is the shipped default and the only setting that
      # runs on any host, because a guest page is a host mmap() and a 4 KB guest
      # cannot boot on a 16 KB one; 4 KB is what most phones are today and what
      # the port's own gate history was collected on, at the cost of a few percent
      # of internal fragmentation. They are separate directories so a run cannot
      # be misread as the other.
      - name: Build the bionic kernel (16 KB pages)
        run: |
          set -euo pipefail
          export NDK="$NDK_HOME/android-ndk-r27c"
          export O="$RUNNER_TEMP/bionic-16k"
          export ART="$RUNNER_TEMP/android/16k"
          export CCACHE_DIR="$RUNNER_TEMP/ccache-bionic"
          export NAME=linux-um STUBNAME=stub_exe PAGESIZE=16k API="$ANDROID_API"
          bash tools/um-arm64/harness/build-bionic.sh

      - name: Build the bionic kernel (4 KB pages)
        run: |
          set -euo pipefail
          export NDK="$NDK_HOME/android-ndk-r27c"
          export O="$RUNNER_TEMP/bionic-4k"
          export ART="$RUNNER_TEMP/android/4k"
          export CCACHE_DIR="$RUNNER_TEMP/ccache-bionic"
          export NAME=linux-um STUBNAME=stub_exe PAGESIZE=4k API="$ANDROID_API"
          bash tools/um-arm64/harness/build-bionic.sh

      - name: Build the bionic networking helpers
        run: |
          set -euo pipefail
          export NDK="$NDK_HOME/android-ndk-r27c"
          export SRC="$RUNNER_TEMP/passt"
          rm -rf "$SRC"
          git clone -q "$PASST_URL" "$SRC"
          git -C "$SRC" checkout -q "$PASST_COMMIT"
          got=$(git -C "$SRC" rev-parse HEAD)
          [ "$got" = "$PASST_COMMIT" ] || {
            echo "passt pin mismatch: got $got" >&2
            exit 1
          }
          export ART="$RUNNER_TEMP/android"
          export PAGE=16384
          bash tools/um-arm64/harness/build-net-bionic.sh
          # 16 KB is the largest page size anything here runs on, and a larger
          # alignment is harmless on a smaller one, so one build serves both
          # directories.
          ls -la "$ART"

      - name: Assemble the artifact
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/android"
          for p in 16k 4k; do
            install -m 0755 tools/um-arm64/dist/umdebian/deb        "$A/$p/deb"
            install -m 0755 tools/um-arm64/dist/umdebian/install.sh "$A/$p/install.sh"
            install -m 0755 "$A/umnet_bionic" "$A/$p/umnet"
            install -m 0755 "$A/passt_bionic" "$A/$p/passt"
            install -m 0755 "$A/appseccomp_bionic" "$A/$p/appseccomp"
            install -m 0755 "$A/umusb_bionic"     "$A/$p/umusb"
            install -m 0755 "$A/sockprobe_bionic" "$A/$p/sockprobe"
          done
          # The intermediate names were for the build, not for the artifact.
          rm -f "$A/umnet_bionic" "$A/passt_bionic"
          {
            echo "# Your own UML, for Android (bionic, aarch64)"
            echo
            echo "Built from \`$(git rev-parse --short HEAD)\` with NDK"
            echo "\`$ANDROID_NDK_VERSION\` (API \`$ANDROID_API\`), statically linked against"
            echo "bionic. This is the variant that runs inside an Android app or an adb or"
            echo "Termux shell. The glibc one in \`um-arm64-kernels\` does not: glibc's"
            echo "startup issues rseq(2) and set_robust_list(2), which the seccomp filter"
            echo "zygote installs kills, so it dies before main() with no output."
            echo
            echo "## Which page size"
            echo
            echo '| | |'
            echo '| --- | --- |'
            echo "| \`16k/\` | \`CONFIG_PAGE_SIZE_16KB\`. Runs on **any** host, 4 KB and 16 KB alike. Use this one. |"
            echo "| \`4k/\` | \`CONFIG_PAGE_SIZE_4KB\`. **Only** on a 4 KB host, which is what most phones still are. A few percent less internal fragmentation. |"
            echo
            echo "Each holds \`linux-um\` (the kernel), \`stub_exe\`, \`deb\` (the launcher) and"
            echo "\`install.sh\`, with the numbers for that binary in \`linux-um.build.txt\`."
            echo
            echo "\`stub_exe\` is not optional on Android: UML normally writes its stub into"
            echo "a memfd and \`execveat\`s it, which an app or shell domain refuses. Without it"
            echo "the kernel exits having printed nothing at all."
            echo
            echo "## Use it"
            echo
            echo 'From the phone, given a Debian image and a `passt`/`umnet` pair:'
            echo
            echo '```sh'
            echo 'mkdir -p ~/um && cd ~/um'
            echo 'cp .../16k/{linux-um,stub_exe,deb} .'
            echo 'cp /path/to/debian.ext4 .'
            echo './deb uname -a'
            echo '```'
            echo
            echo 'Over adb, into an installed directory:'
            echo
            echo '```sh'
            echo 'adb push 16k/linux-um /data/local/tmp/umdebian/linux-um'
            echo 'adb push 16k/stub_exe /data/local/tmp/umdebian/stub_exe'
            echo 'adb push 16k/deb      /data/local/tmp/umdebian/deb'
            echo "adb shell 'cd /data/local/tmp/umdebian && ./deb uname -a'"
            echo '```'
            echo
            echo '`install.sh` checks the page size and refuses a kernel whose guest page is'
            echo "smaller than the device's host page -- which hangs rather than failing. Pass"
            echo '`GUEST_PAGESIZE=16384` (or `4096`) explicitly here, because the file is'
            echo 'called `linux-um` and install.sh will not guess it from that.'
            echo
            echo '## Networking is included'
            echo
            echo '`umnet` and `passt` are in each directory, built here from a pinned'
            echo 'passt commit plus `dist/passt-bionic.patch`, so guest networking works'
            echo 'out of the box: `./deb` finds them next to the kernel and uses them.'
            echo 'Nothing needs root, a tap device or a user namespace; passt reaches the'
            echo 'network by opening ordinary sockets. `UMDEB_NET=0` turns it off.'
            echo
            echo '## Verify it, on the device'
            echo
            echo '```sh'
            echo 'tools/um-arm64/harness/verify-artifact.sh <this dir> <debian image> [passt] [umnet]'
            echo '```'
            echo
            echo 'It walks the whole chain: the kernel md5 against the `build.txt` above, a'
            echo 'boot for every page size that can run on the host, the guest reporting that'
            echo 'page size, a `uname` containing the commit above, gcc building the'
            echo 'libm+pthreads program and it computing correctly, and -- given the helpers --'
            echo 'the guest reaching the network. A page size below the host is skipped with'
            echo 'a reason rather than failed: a guest page is a host mmap().'
          } > "$A/RUN.md"
          find "$A" -type f | sort
          cat "$A"/16k/linux-um.build.txt "$A"/4k/linux-um.build.txt

      - name: ccache stats
        if: always()
        run: CCACHE_DIR="$RUNNER_TEMP/ccache-bionic" ccache --show-stats || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache-bionic
          key: ccache-um-arm64-bionic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      # 30 days rather than the default 14: this one is meant to be downloaded
      # and run, not read after a failure.
      - name: Upload the Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: um-arm64-android
          path: ${{ runner.temp }}/android/
          retention-days: 30

  # The APK, built and verified on the machine that builds it.
  #
  # On an x86_64 runner for the same reason the android job is, and the reason is
  # worth repeating because everything else here is on ubuntu-24.04-arm: the
  # arm64 runner images do not install the Android SDK at all -- the generator
  # skips its whole section under Test-IsArm64 -- and the command-line tools
  # package is an x86_64 build. There is nothing to pin and nothing to download:
  # the x86_64 image ships build-tools and platforms under $ANDROID_HOME, so this
  # job has no third-party artifact to keep current.
  #
  # What it cannot do is run the app. There is no device here, so the APK is
  # checked for the things that otherwise only fail on a phone -- the signature,
  # the aarch64 static binaries inside lib/arm64-v8a/, the assets the app reads at
  # startup, and the manifest's own claims -- by harness/ci-umapp.sh.
  umapp:
    name: apk (umarm)
    runs-on: ubuntu-24.04
    needs: [build, android]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Build the APK
        run: |
          set -euo pipefail
          ls -la "$RUNNER_TEMP/artifacts"
          # build-apk.sh wants $ROOT/artifacts/<name> and $ROOT/dist/umdebian/,
          # so the pieces are staged into that shape rather than the script being
          # taught about the artifact layout.
          export ROOT="$RUNNER_TEMP/umapp-root"
          mkdir -p "$ROOT/artifacts" "$ROOT/dist/umdebian"
          install -m 0755 "$RUNNER_TEMP/artifacts/um-arm64-android/16k/linux-um"  "$ROOT/artifacts/linux-bionic"
          install -m 0755 "$RUNNER_TEMP/artifacts/um-arm64-android/16k/stub_exe" "$ROOT/artifacts/stub_exe_bionic"
          install -m 0755 "$RUNNER_TEMP/artifacts/um-arm64-android/16k/umnet"    "$ROOT/dist/umdebian/umnet"
          install -m 0755 "$RUNNER_TEMP/artifacts/um-arm64-android/16k/passt"    "$ROOT/dist/umdebian/passt"
          # The three the APK used to warn about: the seccomp checker, the USB/IP
          # server, and the probe slot. build-apk.sh has always named them; what
          # was missing was anything that produced them.
          install -m 0755 "$RUNNER_TEMP/artifacts/um-arm64-android/16k/appseccomp" "$ROOT/dist/umdebian/appseccomp"
          install -m 0755 "$RUNNER_TEMP/artifacts/um-arm64-android/16k/umusb"      "$ROOT/dist/umdebian/umusb"
          install -m 0755 "$RUNNER_TEMP/artifacts/um-arm64-android/16k/sockprobe"  "$ROOT/artifacts/sockprobe_bionic"
          # The Alpine initramfs, which is the guest the app boots when it has
          # no disk image: a real busybox and a real shell. It used to be the
          # gate-2 fixture because the tree had no producer for an Alpine one.
          export INITRAMFS="$RUNNER_TEMP/artifacts/um-arm64-kernels/initramfs-alpine.cpiogz"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} JAVA_HOME=${JAVA_HOME:-unset}"
          bash tools/um-arm64/dist/umapp/build-apk.sh

      - name: Verify the APK
        run: bash tools/um-arm64/harness/ci-umapp.sh tools/um-arm64/dist/umapp/umarm.apk

      - name: Upload the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umarm-apk
          path: |
            ${{ github.workspace }}/tools/um-arm64/dist/umapp/umarm.apk
            ${{ github.workspace }}/tools/um-arm64/dist/umapp/build/
          if-no-files-found: warn
          retention-days: 14

  # The flake loop, against the kernel that has loaded a module.
  #
  # This is the item the port's own notes rank first among the open ones and the
  # only one they say explicitly does not carry over: "the 550/550 flake result
  # does not carry over. It has to be re-run after modules land, against a kernel
  # that has actually loaded one." Loading a module changes vmalloc usage and the
  # guest's address-space layout, which is exactly where the stub pages live.
  #
  # Two things make this the loop that answers that rather than a loop that looks
  # like it does. It runs the modules kernel, and harness/guest/flake-init loads a
  # module and then does the fork/exec, the FP torture, the file mapping and the
  # hostfs write *in the same boot* -- because a module loaded in one UML process
  # is gone when that process exits, so a matrix that merely sits next to a
  # module gate would report green either way. And the criterion is native.sh's
  # verdict rather than the marker string, which is the criterion that missed the
  # rss leak.
  flake:
    name: flake loop (modules)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    needs: build
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: um-arm64-kernels
          path: ${{ runner.temp }}/artifacts

      - name: Relax ptrace scope
        run: sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      # Only the rss row needs it, and it is sampled: the row exists because the
      # mapping path is one of the things a loaded module can perturb.
      - name: Build Debian root filesystem
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends debootstrap e2fsprogs
          DISTRO=debian SIZE=2G \
            bash tools/um-arm64/harness/mkrootfs.sh "$RUNNER_TEMP/artifacts/debian.ext4"

      - name: Run the loop
        run: |
          set -euo pipefail
          export ART="$RUNNER_TEMP/artifacts"
          export KERNEL="$RUNNER_TEMP/artifacts/modules"
          export N="${{ github.event.inputs.n || 200 }}"
          export OUT="$RUNNER_TEMP/flake"
          echo "N=$N kernel=$KERNEL"
          bash tools/um-arm64/harness/ci-flake.sh

      - name: Upload the loop
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: um-arm64-flake
          path: ${{ runner.temp }}/flake/
          if-no-files-found: warn
          retention-days: 30

      - name: Step summary
        if: always()
        run: |
          {
            echo "### flake loop"
            echo '```'
            tail -20 "$RUNNER_TEMP/flake/results.tsv" 2>/dev/null || echo "no results.tsv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  umdebian:
    name: umdebian (shipped artifact)
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: um-arm64-kernels
          path: ${{ runner.temp }}/artifacts

      - name: Build Debian root filesystem
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends debootstrap e2fsprogs
          DISTRO=debian SIZE=2G \
            bash tools/um-arm64/harness/mkrootfs.sh "$RUNNER_TEMP/artifacts/debian.ext4"

      - name: Verify the shipped launcher
        run: |
          set -euo pipefail
          export WORK="$RUNNER_TEMP/run/umdebian"
          export KERNEL_BIN="$RUNNER_TEMP/artifacts/default/linux-um-arm64"
          export IMAGE="$RUNNER_TEMP/artifacts/debian.ext4"
          bash tools/um-arm64/harness/ci-umdebian.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: um-arm64-boot-umdebian
          # Named individually on purpose: the run directory also holds the
          # assembled distribution, which is a 2 GB image and not worth
          # uploading. A list is safe here because both files are in one
          # directory -- the artifact has no ancestor above them to be rooted at.
          path: |
            ${{ runner.temp }}/run/umdebian/result.txt
            ${{ runner.temp }}/run/umdebian/checks.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Step summary
        if: always()
        run: |
          {
            echo "### umdebian (shipped artifact)"
            echo '```'
            cat "$RUNNER_TEMP/run/umdebian/result.txt" 2>/dev/null || echo "no result.txt"
            echo '```'
            echo "#### checks"
            echo '```'
            cat "$RUNNER_TEMP/run/umdebian/checks.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  boot:
    name: ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- gate 2: the freestanding guestinit as /init, from an initramfs.
          # This is the built-in default: ptrace userspace with PTRACE_SYSEMU
          # where the host has it. The code default really is ptrace --
          # seccomp_config is a zero-initialised __initdata, so only
          # seccomp=on/auto enable the fast path.
          - { name: g2-default,   kernel: default, initrd: initramfs.cpiogz, init: /init,         marker: UMARM_GUEST_OK,  timeout: "180" }
          - { name: g2-seccomp,   kernel: default, initrd: initramfs.cpiogz, init: /init,         marker: UMARM_GUEST_OK,  timeout: "180", extra: "seccomp=on" }
          - { name: g2-nosysemu,  kernel: default, initrd: initramfs.cpiogz, init: /init,         marker: UMARM_GUEST_OK,  timeout: "180", extra: "nosysemu" }
          # --- the Alpine initramfs, which is what the app boots when it has no
          # disk image. A real busybox and a real musl rather than a freestanding
          # static probe, so what is under test is that the archive is complete:
          # a /init with its own _start cannot tell a full one from an empty one.
          # The port's own loop.sh had this row (g2alpine) and this matrix never
          # did.
          - { name: g2-alpine-initrd, kernel: default, initrd: initramfs-alpine.cpiogz, init: /init, marker: UMARM_INITRD_OK, timeout: "300", extra: "umarm.initrd.test=1" }
          # --- gate 3: a real Alpine ext4 root filesystem from ubd0, which
          # exercises the guest VFS, the block device, fork/exec and teardown.
          - { name: g3-alpine,    kernel: default, ubd0: alpine.ext4, init: /gate3-init,          marker: UMARM_BOOT_OK,   timeout: "300", extra: "rw" }
          # --- gate 4: fork/exec at volume. One stub per guest mm, so 64
          # concurrent children are 64 stub processes.
          - { name: g4-alpine,    kernel: default, ubd0: alpine.ext4, init: /gate4-init,          marker: UMARM_BOOT_OK,   timeout: "900", extra: "rw" }
          # --- gate 5: hostfs. The check that matters is on this side of the
          # boundary: the file the guest wrote has to be readable here.
          - { name: g5-hostfs,    kernel: default, ubd0: alpine.ext4, init: /gate5-init,          marker: UMARM_BOOT_OK,   timeout: "300", extra: "rw", hostfs: "yes", hostfs_check: "renamed-guest.txt" }
          # --- FP/SIMD: the state that is not the GPR set. Not redundant
          # between the two: the port's fixed bug here was seccomp-specific.
          - { name: fp-ptrace,    kernel: default, ubd0: alpine.ext4, init: /fp-init,             marker: FPTORTURE_OK,    timeout: "600", extra: "rw" }
          - { name: fp-seccomp,   kernel: default, ubd0: alpine.ext4, init: /fp-init,             marker: FPTORTURE_OK,    timeout: "600", extra: "rw seccomp=on" }
          # --- the same two gates against a host that forbids
          # ADDR_NO_RANDOMIZE, which is what Android does. The shim is
          # self-proving: PRELOAD_MARKER is required or the run cannot pass.
          - { name: g3-noaslr,    kernel: default, ubd0: alpine.ext4, init: /gate3-init,          marker: UMARM_BOOT_OK,   timeout: "300", extra: "rw", preload: noaslr_preload.so, preload_marker: noaslr_preload_active }
          - { name: fp-noaslr,    kernel: default, ubd0: alpine.ext4, init: /fp-init,             marker: FPTORTURE_OK,    timeout: "600", extra: "rw", preload: noaslr_preload.so, preload_marker: noaslr_preload_active }
          # --- gate 7: a Debian userland, built here, where the guest's own gcc
          # produces a program that uses libm and pthreads and checks its own
          # output. The original gate 7 also ran apt inside the guest, which
          # needs guest networking that CI cannot provide; build-essential is
          # baked into the image instead and the compiler is what is tested.
          - { name: g7-debian,    kernel: default, ubd0: debian.ext4, init: /gate7-init,          marker: UMARM_BOOT_OK,   timeout: "900", extra: "rw", debian: "yes" }
          # --- docker prerequisites, on the kernel built with docker.config.
          # Not dockerd: no containerd, runc or image fits here. What it checks
          # is the list that config exists for, which is where the port's own
          # "docker starts and runs" claim turned out to be false.
          - { name: docker-prereqs, kernel: docker, ubd0: debian.ext4, init: /docker-init,        marker: UMARM_BOOT_OK,   timeout: "900", extra: "rw", debian: "yes" }
          # --- the rss counters, at both page sizes, plus the negative control
          # that gives the clean runs their meaning.
          #
          # check_mm() runs unconditionally from __mmdrop(), so an mm freed with
          # file-backed pages still accounted to it says so. Nothing fails when
          # this is wrong -- the counters are just wrong, and they are the ones
          # the OOM killer reads -- which is why it needs a gate rather than a
          # reader. The workload is deliberately shaped around the mechanism:
          # large folios on ext4, faulted in through a file mapping, one mm freed
          # per child. See harness/guest/rss-init.
          #
          # rss-control is the same kernel built with the literal PTRS_PER_PTE
          # back (config/control-ptrs-per-pte.patch), and it must reproduce the
          # BUG: a control that does not reproduce is reported as a failure of
          # the control, because it would mean the workload never reaches the
          # code and the other two runs prove nothing.
          - { name: rss-16k,     kernel: default, ubd0: debian.ext4, init: /rss-init,           marker: UMARM_BOOT_OK,   timeout: "900", extra: "rw", debian: "yes" }
          # The 4 KB half, which the port's own notes leave as untested. It can
          # only boot on a 4 KB host, and the step skips it with a reason when
          # the runner's pages are larger rather than hanging.
          - { name: rss-4k,      kernel: 4k,      ubd0: debian.ext4, init: /rss-init,           marker: UMARM_BOOT_OK,   timeout: "900", extra: "rw", debian: "yes" }
          - { name: rss-control, kernel: control, ubd0: debian.ext4, init: /rss-init,           marker: UMARM_BOOT_OK,   timeout: "900", extra: "rw", debian: "yes", expect_bug: "Bad rss-counter" }
          # The clock rate gate. clock-guest must show the guest's CLOCK_MONOTONIC
          # agreeing with the host's wall time; clock-control is the same kernel
          # with timer_read() returning double (config/control-clock.patch) and
          # must *disagree*, which is what makes a green clock-guest mean
          # something. Neither number had ever been measured on either side.
          - { name: clock-guest,   kernel: default,       ubd0: alpine.ext4, init: /clock-init, marker: UMARM_BOOT_OK, timeout: "900", extra: "rw", hostfs: "yes", hostfs_check: "", clock_slack: "5" }
          - { name: clock-control, kernel: control-clock, ubd0: alpine.ext4, init: /clock-init, marker: UMARM_BOOT_OK, timeout: "900", extra: "rw", hostfs: "yes", hostfs_check: "", clock_slack: "5", expect_verdict: "CLOCK_FAIL" }
          # The mm_list use-after-free fix (b38e70bc1) and its control, both on
          # the kernel with start_userspace() fault injection. stubfail must
          # reach the marker across the injected failure; stubfail-control must
          # hang, because the freed mm stays on mm_list and the next SIGCHLD
          # walk loops. The fixed row requires the injection diagnostic; the
          # control expects that same diagnostic plus the hang verdict, so a
          # control that does not reproduce is a failure of the control.
          # The init_new_context() error path, exercised on purpose. The injection
          # fires exactly once and the guest must survive it: reaching the marker
          # means the path is reachable and survivable, which it had never been in
          # CI. It is not a control for the list_del fix -- a control was built
          # (config/control-mm-list.patch) and does *not* reproduce under this
          # workload, which is recorded in doc/60-continuation.md rather than
          # papered over with a row that cannot fail.
          - { name: stubfail,         kernel: stubfail,         ubd0: alpine.ext4, init: /stubfail-init, marker: UMARM_BOOT_OK, timeout: "900", extra: "rw stubfail=1000", require: "start_userspace failed STUBFORK done" }
          # --- gate 10: loadable modules, at the three memory sizes that decide
          # which relocation path the loader takes. The module arrives through a
          # hostfs share, so hostfs_check is empty on purpose: there is no file
          # for the guest to write back here, and a check that cannot be
          # satisfied would fail every run.
          #
          # mem=64M: no PLT needed. mem=512M: the module is far enough from the
          # kernel text that CALL26 cannot reach and PLTs are mandatory.
          # mem=3G: ADRP near its limit, which exercises the veneer. Testing only
          # the default skips the whole PLT path while looking green.
          - { name: mod-64m,     kernel: modules, ubd0: alpine.ext4, init: /module-init,        marker: UMARM_BOOT_OK,   timeout: "600", extra: "rw", hostfs: "yes", hostfs_check: "", mem: "64M" }
          - { name: mod-512m,    kernel: modules, ubd0: alpine.ext4, init: /module-init,        marker: UMARM_BOOT_OK,   timeout: "600", extra: "rw", hostfs: "yes", hostfs_check: "", mem: "512M" }
          - { name: mod-3g,      kernel: modules, ubd0: alpine.ext4, init: /module-init,        marker: UMARM_BOOT_OK,   timeout: "600", extra: "rw", hostfs: "yes", hostfs_check: "", mem: "3G" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: um-arm64-kernels
          path: ${{ runner.temp }}/artifacts

      # UML is the ptrace tracer of its own stub children. yama ptrace_scope=1
      # (the Ubuntu default) already allows tracing descendants; 0 removes any
      # doubt. Failure here is not fatal to the run.
      - name: Relax ptrace scope
        run: |
          cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || echo "no yama"
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      # debootstrap is only paid for by the two gates that need a Debian guest.
      - name: Build Debian root filesystem
        if: matrix.debian == 'yes'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends debootstrap e2fsprogs
          DISTRO=debian SIZE=2G \
            bash tools/um-arm64/harness/mkrootfs.sh "$RUNNER_TEMP/artifacts/debian.ext4"

      - name: Boot gate
        run: |
          set -euo pipefail
          ls -la "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/artifacts/${{ matrix.kernel }}" || true

          # A guest page is a host mmap(), so a 4 KB guest cannot boot on a host
          # with larger pages: it hangs rather than failing. Skipping says
          # something about the host and nothing about the kernel, so it is
          # reported as a skip with the reason attached, never as a pass.
          #
          # getconf is not everywhere (Termux has no getconf), and an empty
          # answer here used to fall through to [ "" -gt 4096 ], which is an
          # error under set -e: the gate would fail for a reason that has
          # nothing to do with the kernel. Undeterminable is an error, not a
          # guess -- guessing wrong either hangs the boot or skips a gate that
          # could have run.
          HOST_PAGE=$(getconf PAGESIZE 2>/dev/null ||
                      python3 -c 'import os; print(os.sysconf("SC_PAGE_SIZE"))' 2>/dev/null || true)
          case "$HOST_PAGE" in
          '' | *[!0-9]*)
            echo "::error::cannot determine the host page size (no getconf, no python3)" >&2
            exit 1
            ;;
          esac
          echo "host page size $HOST_PAGE"
          if [ "${{ matrix.kernel }}" = 4k ] && [ "$HOST_PAGE" -gt 4096 ]; then
            echo "::warning::${{ matrix.name }} skipped: a 4 KB guest cannot boot on a $HOST_PAGE-page host"
            mkdir -p "$RUNNER_TEMP/run/${{ matrix.name }}/skipped"
            printf 'gate=%s\nverdict=SKIP\nreason=host page size %s > 4096\n' \
              "${{ matrix.name }}" "$HOST_PAGE" \
              > "$RUNNER_TEMP/run/${{ matrix.name }}/skipped/result.txt"
            exit 0
          fi

          export BIN="$RUNNER_TEMP/artifacts/${{ matrix.kernel }}/linux-um-arm64"
          export ART="$RUNNER_TEMP/run"
          export GATE="${{ matrix.name }}"
          export MARKER="${{ matrix.marker }}"
          export INIT="${{ matrix.init }}"
          export TIMEOUT="${{ matrix.timeout }}"
          # Only the module gates vary it, and the size is part of what they
          # test rather than a detail of the fixture.
          export MEM="${{ matrix.mem }}"
          [ -n "$MEM" ] || export MEM=512M
          export EXTRA_ARGS="${{ matrix.extra }}"
          [ -z "${{ matrix.initrd }}" ] || export INITRD="$RUNNER_TEMP/artifacts/${{ matrix.initrd }}"
          [ -z "${{ matrix.ubd0 }}" ]   || export UBD0="$RUNNER_TEMP/artifacts/${{ matrix.ubd0 }}"
          # Per-kernel files live next to the kernel they were built with, not at
          # the artifact root: the build job writes two kernels into two
          # directories, and only the shared fixtures (initramfs, disk images)
          # are at the top.
          [ -z "${{ matrix.preload }}" ] || export PRELOAD="$RUNNER_TEMP/artifacts/${{ matrix.kernel }}/${{ matrix.preload }}"
          [ -z "${{ matrix.preload_marker }}" ] || export PRELOAD_MARKER="${{ matrix.preload_marker }}"
          # Set only on the negative control, where the diagnostic appearing is
          # the expected result rather than a defect.
          [ -z "${{ matrix.expect_bug }}" ] || export EXPECT_BUG="${{ matrix.expect_bug }}"
          [ -z "${{ matrix.clock_slack }}" ] || export CLOCK_SLACK="${{ matrix.clock_slack }}"
          [ -z "${{ matrix.expect_verdict }}" ] || export EXPECT_VERDICT="${{ matrix.expect_verdict }}"
          if [ "${{ matrix.hostfs }}" = yes ]; then
            export HOSTFS="$RUNNER_TEMP/hostshare"
            export HOSTFS_CHECK="${{ matrix.hostfs_check }}"
            # The module gates get their .ko from the share, so whatever the
            # kernel build collected goes in before the guest starts. Copied
            # rather than linked: the share is read by the guest through hostfs
            # and by the check below on this side.
            if [ -d "$RUNNER_TEMP/artifacts/${{ matrix.kernel }}/modules" ]; then
              mkdir -p "$HOSTFS"
              cp "$RUNNER_TEMP/artifacts/${{ matrix.kernel }}/modules/"*.ko "$HOSTFS/"
              ls -la "$HOSTFS"
            fi
          fi
          bash tools/um-arm64/harness/native.sh

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: um-arm64-boot-${{ matrix.name }}
          path: ${{ runner.temp }}/run/${{ matrix.name }}
          if-no-files-found: warn
          retention-days: 14

      - name: Step summary
        if: always()
        run: |
          # native.sh writes <gate>/<stamp>/result.txt and a <gate>-latest
          # symlink next to it. Reading <gate>/result.txt found nothing, so this
          # summary said "no result.txt" on every gate -- the one place a human
          # looks, empty.
          R="$RUNNER_TEMP/run/${{ matrix.name }}-latest"
          [ -d "$R" ] || R=$(ls -dt "$RUNNER_TEMP/run/${{ matrix.name }}"/* 2>/dev/null | head -1)
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            cat "${R:-/nonexistent}/result.txt" 2>/dev/null || echo "no result.txt"
            echo '```'
            if [ -s "$R/kernel-bugs.txt" ]; then
              echo "#### kernel diagnostics"
              echo '```'
              cat "$R/kernel-bugs.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
